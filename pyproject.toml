[project]
name = "dbms-project"
version = "0.1.0"
description = "ConText2Cypher: graph-aware natural language to Cypher"
readme = "README.md"
authors = [
    { name = "Triman Singh", email = "trimantuteja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "neo4j>=6.4.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Retriever 2 (embeddings):  uv sync --extra semantic
semantic = [
    "sentence-transformers>=3.0",
]

# This is a folder of scripts, not an installable package.
[tool.uv]
package = false
